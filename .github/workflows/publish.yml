name: Publish Release to GitHub Packages

on:
  push:
    tags:
      - "v*.*.*"

defaults:
  run:
    shell: bash

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: read
      id-token: write

    steps:
    - name: CargoWall
      uses: code-cargo/cargowall-action@78f9fbcb3561c6ad9289e5b740616216e8cbd232 # v1.3.5
    - uses: actions/checkout@v6

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 8.x.x

    - name: Build and strong name
      run: dotnet build --configuration Release --no-incremental -p:version=${GITHUB_REF#refs/*/v} -p:SignAssembly=true -p:AssemblyOriginatorKeyFile=../key.snk

    - name: Pack SDK
      run: dotnet pack -p:version=${GITHUB_REF#refs/*/v} -o ./publish

    - name: Publish to GitHub Packages
      run: dotnet nuget push ./publish/*.nupkg --skip-duplicate --source "https://nuget.pkg.github.com/${GITHUB_REPOSITORY_OWNER}/index.json" --api-key "${NUGET_AUTH_TOKEN}"
      env:
        NUGET_AUTH_TOKEN: ${{secrets.GITHUB_TOKEN}}
